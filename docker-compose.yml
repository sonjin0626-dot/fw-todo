services:
  db:
    image: mysql:8.0
    container_name: fw-mysql
    environment:
      MYSQL_DATABASE: todoapp
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Tokyo
    command: --default-time-zone=+09:00
    ports:
      - "3306:3306"
    volumes:
      - fw-db-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    container_name: fw-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/todoapp
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_UPLOAD_DIR: /app/uploads
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@example.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_MAIL_REMINDERS_ENABLED: ${APP_MAIL_REMINDERS_ENABLED:-true}
      APP_MAIL_ZONE: ${APP_MAIL_ZONE:-Asia/Tokyo}
    volumes:
      - fw-upload-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  fw-db-data:
    name: fw-db-data
  fw-upload-data:
    name: fw-upload-data
