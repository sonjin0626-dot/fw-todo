spring.application.name=todoapp
app.async.report-timeout-seconds=3
# falseではSMTP通信を行わず、通知の対象IDと形式だけをログで確認する。
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:noreply@example.com}}
app.mail.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail.max-attempts=${APP_MAIL_MAX_ATTEMPTS:3}
app.mail.zone=${APP_MAIL_ZONE:Asia/Tokyo}
app.mail.reminders-enabled=${APP_MAIL_REMINDERS_ENABLED:true}
app.mail.reminder-cron=${APP_MAIL_REMINDER_CRON:0 0 9 * * *}
app.mail.overdue-interval-ms=3600000
app.mail.overdue-initial-delay-ms=60000
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600
spring.messages.fallback-to-system-locale=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.datasource.url=jdbc:mysql://localhost:3306/todoapp
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:password}
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# 既存テーブルは保持する。所有者列の追加はTodoOwnershipSchemaInitializerで実行する。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/users.sql,classpath:db/todos.sql,classpath:db/transactions.sql,classpath:db/attachments.sql
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
# multipartのヘッダー等の余裕を確保し、10MBちょうどのファイルも受け付ける。
spring.servlet.multipart.max-request-size=11MB
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.ai.mcp.server.protocol=STREAMABLE
weather.api.url=${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast?latitude=35.68&longitude=139.76&daily=weather_code&timezone=Asia%2FTokyo&forecast_days=7}
weather.api.connect-timeout-ms=${WEATHER_API_CONNECT_TIMEOUT_MS:3000}
weather.api.read-timeout-ms=${WEATHER_API_READ_TIMEOUT_MS:5000}
