<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{todo.edit}">編集</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <nav th:replace="~{fragments/language :: language}"></nav>
        <nav th:replace="~{fragments/account :: account}"></nav>
        <h1 class="page-title" th:text="#{todo.edit}">編集</h1>
        <p xmlns:sec="http://www.thymeleaf.org/extras/spring-security" sec:authorize="hasRole('ADMIN')">
            <a class="link" th:href="@{/admin/audit-logs/entity/TODO/{id}(id=${id})}" th:text="#{audit.history}">変更履歴</a>
        </p>
        <form th:action="@{/todos/{id}/confirm(id=${id})}" th:object="${todo}" method="post" th:attr="data-language-action=@{/todos/{id}/edit(id=${id})}">
            <div class="form-row">
                <label class="form-label" for="title" th:text="#{todo.title}">やること</label>
                <input class="form-input" type="text" th:field="*{title}">
                <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="detail" th:text="#{todo.detail}">メモ</label>
                <input class="form-input" type="text" th:field="*{detail}">
                <p class="error" th:if="${#fields.hasErrors('detail')}" th:errors="*{detail}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="category" th:text="#{todo.category}">ジャンル</label>
                <select class="form-input" th:field="*{category}">
                    <option value=""></option>
                    <option value="デザイン" th:text="#{category.design}">デザイン</option>
                    <option value="マーケティング" th:text="#{category.marketing}">マーケティング</option>
                    <option value="プログラミング" th:text="#{category.programming}">プログラミング</option>
                    <option value="資格" th:text="#{category.certification}">資格</option>
                    <option value="就職活動" th:text="#{category.jobHunting}">就職活動</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="priority" th:text="#{todo.priority}">優先度</label>
                <select class="form-input" th:field="*{priority}">
                    <option value=""></option>
                    <option value="1" th:text="#{priority.high}">高</option>
                    <option value="2" th:text="#{priority.medium}">中</option>
                    <option value="3" th:text="#{priority.low}">低</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="dueDate" th:text="#{todo.dueDate}">期限</label>
                <input class="form-input" type="date" th:field="*{dueDate}">
            </div>
            <div class="form-row">
                <label class="form-label" for="completed" th:text="#{todo.completed}">完了</label>
                <input type="checkbox" id="completed" th:field="*{completed}">
            </div>
            <div th:replace="~{fragments/tags :: tagEditor}"></div>
            <button class="btn" type="submit" th:text="#{common.confirm}">確認する</button>
            <a class="btn sub" th:href="@{/todos}" th:text="#{todo.back}">一覧へ</a>
            <a class="btn sub" th:href="@{/todos/{id}/attach(id=${id})}" th:text="#{attachment.title}">添付ファイル</a>
        </form>
    </div>
</body>
</html>
