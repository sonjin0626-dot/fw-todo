<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント登録 | ToDo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="container auth-container">
        <h1 class="page-title">アカウント登録</h1>
        <form th:action="@{/register}" th:object="${registrationForm}" method="post">
            <div class="flash error" th:if="${#fields.hasAnyErrors()}" role="alert">
                <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
            </div>
            <div class="form-row">
                <label class="form-label" for="username">ユーザー名</label>
                <input class="form-input" type="text" th:field="*{username}" autocomplete="username" minlength="3" maxlength="50" pattern="[a-zA-Z0-9_\-]{3,50}" required autofocus aria-describedby="username-help">
                <small id="username-help">半角英数字・ハイフン・アンダースコアの3〜50文字</small>
            </div>
            <div class="form-row">
                <label class="form-label" for="password">パスワード</label>
                <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="password-help">
                <small id="password-help">8文字以上、UTF-8で72バイト以内</small>
            </div>
            <div class="form-row">
                <label class="form-label" for="passwordConfirmation">パスワード（確認）</label>
                <input class="form-input" type="password" id="passwordConfirmation" name="passwordConfirmation" autocomplete="new-password" minlength="8" maxlength="72" required>
            </div>
            <button class="btn" type="submit">アカウントを登録する</button>
        </form>
        <p><a class="link" th:href="@{/login}">ログインへ戻る</a></p>
    </main>
</body>
</html>
