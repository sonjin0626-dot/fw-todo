<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | ToDo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="container auth-container">
        <h1 class="page-title">ログイン</h1>
        <p class="flash" th:if="${param.accountUpdated}" role="status">アカウント情報を更新しました。新しい情報でログインしてください。</p>
        <p class="flash error" th:if="${param.error}" role="alert">ユーザー名またはパスワードが正しくありません</p>
        <p class="flash" th:if="${param.logout}" role="status">ログアウトしました</p>
        <p class="flash" th:if="${param.registered}" role="status">アカウントを登録しました。ログインしてください。</p>
        <form th:action="@{/login}" method="post">
            <div class="form-row">
                <label class="form-label" for="username">ユーザー名</label>
                <input class="form-input" type="text" id="username" name="username" autocomplete="username" maxlength="50" required autofocus>
            </div>
            <div class="form-row">
                <label class="form-label" for="password">パスワード</label>
                <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button class="btn" type="submit">ログイン</button>
        </form>
        <p>初めての方は <a class="link" th:href="@{/register}">アカウント登録</a></p>
    </main>
</body>
</html>
