<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.loginTitle}">ログイン | ToDo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="container auth-container">
        <nav th:replace="~{fragments/language :: language}"></nav>
        <h1 class="page-title" th:text="#{auth.login}">ログイン</h1>
        <p class="flash" th:if="${param.accountUpdated}" role="status" th:text="#{auth.accountUpdated}">アカウント情報を更新しました。新しい情報でログインしてください。</p>
        <p class="flash error" th:if="${param.error}" role="alert" th:text="#{auth.invalid}">ユーザー名またはパスワードが正しくありません</p>
        <p class="flash" th:if="${param.logout}" role="status" th:text="#{auth.loggedOut}">ログアウトしました</p>
        <p class="flash" th:if="${param.registered}" role="status" th:text="#{auth.registered}">アカウントを登録しました。ログインしてください。</p>
        <form th:action="@{/login}" method="post">
            <div class="form-row">
                <label class="form-label" for="username" th:text="#{auth.username}">ユーザー名</label>
                <input class="form-input" type="text" id="username" name="username" autocomplete="username" maxlength="50" required autofocus>
            </div>
            <div class="form-row">
                <label class="form-label" for="password" th:text="#{auth.password}">パスワード</label>
                <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button class="btn" type="submit" th:text="#{auth.login}">ログイン</button>
        </form>
        <p><span th:text="#{auth.newUser}">初めての方は</span> <a class="link" th:href="@{/register}" th:text="#{auth.register}">アカウント登録</a></p>
    </main>
</body>
</html>
