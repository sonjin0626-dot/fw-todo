<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{calendar.title}">カレンダー</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
    <style>
        .calendar-table td.saturday {
            background-color: #e0f2fe;
        }

        .calendar-table td.sunday {
            background-color: #fce7f3;
        }

        .calendar-table td.holiday {
            background-color: #fef3c7;
        }

        .calendar-table .todo-name,
        .calendar-table .todo-more {
            color: #334155;
        }

        .calendar-table .todo-name.overdue {
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <div class="container">
        <nav th:replace="~{fragments/language :: language}"></nav>
        <nav th:replace="~{fragments/account :: account}"></nav>
        <p id="holidays-unavailable" role="status" hidden th:text="#{calendar.holidaysUnavailable}">祝日を取れませんでした</p>
        <p id="weather-unavailable" role="status" hidden th:text="#{calendar.weatherUnavailable}">天気を取得できませんでした</p>
        <h1 class="page-title" th:if="${!weekView}" th:text="#{calendar.monthHeading(${displayMonth.year.toString()},${displayMonth.monthValue.toString()})}">カレンダー</h1>
        <h1 class="page-title" th:if="${weekView}"
            th:text="#{calendar.range(${#temporals.format(firstDate, #messages.msg('calendar.datePattern'))},${#temporals.format(lastDate, #messages.msg('calendar.datePattern'))})}">週間カレンダー</h1>
        <nav class="calendar-nav" th:attr="aria-label=#{calendar.navigation}">
            <div class="calendar-nav-group" th:if="${!weekView}">
                <a class="link" th:href="@{/calendar(year=${previousMonth.year},month=${previousMonth.monthValue})}" th:text="#{calendar.previousMonth}">前の月</a>
                <a class="link" th:href="@{/calendar(year=${nextMonth.year},month=${nextMonth.monthValue})}" th:text="#{calendar.nextMonth}">次の月</a>
            </div>
            <div class="calendar-nav-group" th:if="${weekView}">
                <a class="link" th:href="@{/calendar(view=week,date=${previousWeek})}" th:text="#{calendar.previousWeek}">前の週</a>
                <a class="link" th:href="@{/calendar(view=week,date=${nextWeek})}" th:text="#{calendar.nextWeek}">次の週</a>
            </div>
            <div class="calendar-nav-group" th:attr="aria-label=#{calendar.switch}">
                <a class="link" th:href="@{/calendar(year=${displayMonth.year},month=${displayMonth.monthValue},date=${referenceDate})}"
                    th:attr="aria-current=${!weekView ? 'page' : null}" th:text="#{calendar.monthView}">月で見る</a>
                <a class="link" th:href="@{/calendar(view=week,date=${referenceDate})}"
                    th:attr="aria-current=${weekView ? 'page' : null}" th:text="#{calendar.weekView}">週で見る</a>
            </div>
            <div class="calendar-nav-group">
                <a class="link" th:href="@{/todos}" th:text="#{calendar.tableView}">表で見る</a>
                <a class="btn" th:href="@{/todos/new}" th:text="#{todo.new}">新規登録</a>
            </div>
        </nav>
        <table class="calendar-table" th:classappend="${weekView ? 'calendar-week' : ''}"
            th:attr="data-from=${firstDate},data-to=${lastDate},data-view=${weekView ? 'week' : 'month'},aria-label=${weekView ? #messages.msg('calendar.week') : #messages.msg('calendar.month')}">
            <thead>
                <tr>
                    <th scope="col" th:text="#{weekday.sun}">日</th>
                    <th scope="col" th:text="#{weekday.mon}">月</th>
                    <th scope="col" th:text="#{weekday.tue}">火</th>
                    <th scope="col" th:text="#{weekday.wed}">水</th>
                    <th scope="col" th:text="#{weekday.thu}">木</th>
                    <th scope="col" th:text="#{weekday.fri}">金</th>
                    <th scope="col" th:text="#{weekday.sat}">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${weeks}">
                    <td th:each="date : ${week}" th:attr="data-date=${date}">
                        <span th:if="${date != null}" th:text="${weekView ? #temporals.format(date, 'M/d') : date.dayOfMonth}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
        <p class="weather-source">
            <span th:text="#{calendar.weatherSource}">東京周辺の天気（今日を含む7日間）。出典：</span>
            <a class="link" href="https://open-meteo.com/">Open-Meteo</a>
            （<a class="link" href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a><span th:text="#{calendar.weatherLicense}">、天気コードを日本語に分類）</span>
        </p>
    </div>
    <script th:inline="javascript">
        const moreMessage = /*[[#{calendar.more('COUNT_VALUE')}]]*/ 'COUNT_VALUE more';
        const weatherNames = {
            clear: /*[[#{weather.clear}]]*/ 'Clear',
            cloudy: /*[[#{weather.cloudy}]]*/ 'Cloudy',
            fog: /*[[#{weather.fog}]]*/ 'Fog',
            rain: /*[[#{weather.rain}]]*/ 'Rain',
            snow: /*[[#{weather.snow}]]*/ 'Snow',
            thunder: /*[[#{weather.thunder}]]*/ 'Thunderstorms',
            unknown: /*[[#{weather.unknown}]]*/ 'Unknown'
        };
        function weatherName(code) {
            if ([0, 1].includes(code)) return weatherNames.clear;
            if ([2, 3].includes(code)) return weatherNames.cloudy;
            if ([45, 48].includes(code)) return weatherNames.fog;
            if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return weatherNames.rain;
            if ([71, 73, 75, 77, 85, 86].includes(code)) return weatherNames.snow;
            if ([95, 96, 97, 99].includes(code)) return weatherNames.thunder;
            return weatherNames.unknown;
        }
        const table = document.querySelector('table[data-from]');
        const from = table.dataset.from;
        const to = table.dataset.to;
        const weekView = table.dataset.view === 'week';

        async function loadTodos() {
            try {
                const res = await fetch(`/api/todos?from=${from}&to=${to}`);
                if (!res.ok) {
                    throw new Error('やることを取得できませんでした。');
                }
                const todos = await res.json();
                const now = new Date();
                const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const nearDate = new Date(now);
                nearDate.setDate(nearDate.getDate() + 3);
                const nearDeadline = `${nearDate.getFullYear()}-${String(nearDate.getMonth() + 1).padStart(2, '0')}-${String(nearDate.getDate()).padStart(2, '0')}`;

                for (const cell of table.querySelectorAll('td[data-date]')) {
                    const dailyTodos = todos.filter(todo => todo.dueDate === cell.dataset.date);
                    const visibleTodos = weekView ? dailyTodos : dailyTodos.slice(0, 3);
                    for (const todo of visibleTodos) {
                        const name = document.createElement('a');
                        name.classList.add('todo-name');
                        name.href = `/todos/${todo.id}/edit`;
                        name.textContent = todo.title;
                        if (todo.dueDate < today && todo.completed !== true) {
                            name.classList.add('overdue');
                        } else if (todo.dueDate >= today && todo.dueDate <= nearDeadline && todo.completed !== true) {
                            name.classList.add('near-deadline');
                        }
                        cell.appendChild(name);
                    }
                    if (!weekView && dailyTodos.length > 3) {
                        const more = document.createElement('div');
                        more.classList.add('todo-more');
                        more.textContent = moreMessage.replace('COUNT_VALUE', dailyTodos.length - 3);
                        cell.appendChild(more);
                    }
                }
            } catch (error) {
                console.error('やることの読み込みに失敗しました。', error);
            }
        }

        async function loadHolidays() {
            const cells = table.querySelectorAll('td[data-date]');
            const unavailable = document.getElementById('holidays-unavailable');

            for (const cell of cells) {
                const day = new Date(`${cell.dataset.date}T00:00:00`).getDay();
                if (day === 6) {
                    cell.classList.add('saturday');
                } else if (day === 0) {
                    cell.classList.add('sunday');
                }
            }

            try {
                const res = await fetch(`/api/holidays?from=${from}&to=${to}`);
                if (res.headers.has('X-Holidays-Unavailable')) {
                    unavailable.hidden = false;
                }
                if (!res.ok) {
                    throw new Error('祝日を取得できませんでした。');
                }
                const holidays = await res.json();

                for (const cell of cells) {
                    const holidayName = holidays[cell.dataset.date];
                    if (holidayName) {
                        cell.classList.add('holiday');
                        cell.title = holidayName;
                    }
                }
            } catch (error) {
                unavailable.hidden = false;
                console.error('祝日の読み込みに失敗しました。', error);
            }
        }

        async function loadWeather() {
            const unavailable = document.getElementById('weather-unavailable');
            try {
                const res = await fetch('/api/weather');
                if (!res.ok || res.headers.has('X-Weather-Unavailable')) {
                    throw new Error('天気を取得できませんでした。');
                }
                const forecast = await res.json();
                if (!Array.isArray(forecast)) {
                    throw new Error('天気の形式が正しくありません。');
                }
                const cells = new Map(Array.from(table.querySelectorAll('td[data-date]'),
                    cell => [cell.dataset.date, cell]));
                for (const day of forecast) {
                    const cell = cells.get(day.date);
                    if (!cell || typeof day.weatherName !== 'string') {
                        continue;
                    }
                    const weather = document.createElement('span');
                    weather.classList.add('calendar-weather');
                    weather.textContent = weatherName(day.weatherCode);
                    cell.querySelector('span').after(weather);
                }
            } catch (error) {
                unavailable.hidden = false;
                console.error('天気の読み込みに失敗しました。', error);
            }
        }

        loadTodos();
        loadHolidays();
        loadWeather();
    </script>
</body>

</html>
