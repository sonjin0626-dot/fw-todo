<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="#{admin.users}">ユーザー管理</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="container">
        <nav th:replace="~{fragments/language :: language}"></nav>
    <nav th:replace="~{fragments/account :: account}"></nav>
    <h1 th:text="#{admin.users}">ユーザー管理</h1>
    <p class="flash" th:if="${message != null}" th:text="${message}"></p>
    <table class="todo-table">
        <thead><tr><th>ID</th><th th:text="#{auth.username}">ユーザー名</th><th th:text="#{admin.role}">ロール</th><th th:text="#{common.status}">状態</th><th th:text="#{admin.createdDate}">登録日</th><th th:text="#{common.actions}">操作</th></tr></thead>
        <tbody><tr th:each="user : ${users}">
            <td th:text="${user.id}"></td><td th:text="${user.username}"></td>
            <td th:text="${user.role}"></td><td th:text="${user.enabled ? #messages.msg('admin.enabled') : #messages.msg('admin.disabled')}"></td>
            <td th:text="${#temporals.format(user.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
            <td><div class="user-actions">
                <a class="link" th:href="@{/admin/users/{id}(id=${user.id})}" th:text="#{common.detail}">詳細</a>
                <a class="link" th:href="@{/admin/users/{id}/edit(id=${user.id})}" th:text="#{todo.edit}">編集</a>
                <form th:if="${user.username != #authentication.name}" th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post"
                      th:attr="data-confirm-message=#{admin.deleteConfirm}" onsubmit="return window.confirm(this.dataset.confirmMessage)">
                    <button class="btn btn-danger" type="submit" th:text="#{common.delete}">削除</button>
                </form>
            </div></td>
        </tr></tbody>
    </table>
</main></body></html>
