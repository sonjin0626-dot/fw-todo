<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ユーザー管理</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="container">
    <nav th:replace="~{fragments/account :: account}"></nav>
    <h1>ユーザー管理</h1>
    <p class="flash" th:if="${message != null}" th:text="${message}"></p>
    <table class="todo-table">
        <thead><tr><th>ID</th><th>ユーザー名</th><th>ロール</th><th>状態</th><th>登録日</th><th>操作</th></tr></thead>
        <tbody><tr th:each="user : ${users}">
            <td th:text="${user.id}"></td><td th:text="${user.username}"></td>
            <td th:text="${user.role}"></td><td th:text="${user.enabled ? '有効' : '無効'}"></td>
            <td th:text="${#temporals.format(user.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
            <td><div class="user-actions">
                <a class="link" th:href="@{/admin/users/{id}(id=${user.id})}">詳細</a>
                <a class="link" th:href="@{/admin/users/{id}/edit(id=${user.id})}">編集</a>
                <form th:if="${user.username != #authentication.name}" th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post"
                      onsubmit="return confirm('このユーザーを削除しますか？\nゴミ箱内を含む関連ToDoもすべて削除され、復元できません。')">
                    <button class="btn btn-danger" type="submit">削除</button>
                </form>
            </div></td>
        </tr></tbody>
    </table>
</main></body></html>
