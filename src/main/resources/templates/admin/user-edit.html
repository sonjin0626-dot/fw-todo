<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ユーザー情報の編集</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="container">
    <nav th:replace="~{fragments/account :: account}"></nav>
    <h1>ユーザー情報の編集</h1>
    <p th:text="${managedUser.username}"></p>
    <p>変更は、対象ユーザーの次のリクエストから反映されます。自分自身の管理者権限・有効状態は解除できません。</p>
    <p>自分のユーザー名・パスワードを変更すると、再ログインが必要です。</p>
    <form th:action="@{/admin/users/{id}(id=${managedUser.id})}" th:object="${form}" method="post">
        <div class="flash error" th:if="${#fields.hasAnyErrors()}" role="alert">
            <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
        </div>
        <div class="form-row">
            <label for="username">ユーザー名</label>
            <input class="form-input" type="text" th:field="*{username}" minlength="3" maxlength="50" required aria-describedby="username-help">
            <small id="username-help">半角英数字・ハイフン・アンダースコアの3〜50文字</small>
        </div>
        <div class="form-row">
        <label for="role">ロール</label>
        <select class="form-input" th:field="*{role}">
            <option value="USER">USER（一般ユーザー）</option>
            <option value="ADMIN">ADMIN（管理者）</option>
        </select>
        </div>
        <div class="form-row">
            <label><input type="checkbox" th:field="*{enabled}">アカウントを有効にする</label>
        </div>
        <div class="form-row">
            <label for="newPassword">新しいパスワード（変更する場合のみ）</label>
            <input class="form-input" type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="password-help">
            <small id="password-help">空欄なら変更しません。8文字以上、UTF-8で72バイト以内。旧パスワードの入力は不要です。</small>
        </div>
        <button class="btn" type="submit">保存する</button>
        <a class="link" th:href="@{/admin/users}">戻る</a>
    </form>
</main></body></html>
