<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="#{admin.edit}">ユーザー情報の編集</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="container">
        <nav th:replace="~{fragments/language :: language}"></nav>
    <nav th:replace="~{fragments/account :: account}"></nav>
    <h1 th:text="#{admin.edit}">ユーザー情報の編集</h1>
    <p th:text="${managedUser.username}"></p>
    <p th:text="#{admin.changeHelp}">変更は、対象ユーザーの次のリクエストから反映されます。自分自身の管理者権限・有効状態は解除できません。</p>
    <p th:text="#{admin.loginHelp}">自分のユーザー名・パスワードを変更すると、再ログインが必要です。</p>
    <form th:action="@{/admin/users/{id}(id=${managedUser.id})}" th:object="${form}" method="post">
        <div class="flash error" th:if="${#fields.hasAnyErrors()}" role="alert">
            <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
        </div>
        <div class="form-row">
            <label for="username" th:text="#{auth.username}">ユーザー名</label>
            <input class="form-input" type="text" th:field="*{username}" minlength="3" maxlength="50" required aria-describedby="username-help">
            <small id="username-help" th:text="#{auth.usernameHelp}">半角英数字・ハイフン・アンダースコアの3〜50文字</small>
        </div>
        <div class="form-row">
            <label for="email" th:text="#{auth.email}">メールアドレス（任意）</label>
            <input class="form-input" type="email" th:field="*{email}" maxlength="254" autocomplete="email" aria-describedby="email-help">
            <small id="email-help" th:text="#{auth.emailHelp}">設定すると、ToDo作成通知と期限通知を受け取れます。</small>
        </div>
        <div class="form-row">
        <label for="role" th:text="#{admin.role}">ロール</label>
        <select class="form-input" th:field="*{role}">
            <option value="USER" th:text="#{admin.roleUser}">USER（一般ユーザー）</option>
            <option value="ADMIN" th:text="#{admin.roleAdmin}">ADMIN（管理者）</option>
        </select>
        </div>
        <div class="form-row">
            <label><input type="checkbox" th:field="*{enabled}" th:text="#{admin.enable}">アカウントを有効にする</label>
        </div>
        <div class="form-row">
            <label for="newPassword" th:text="#{admin.newPassword}">新しいパスワード（変更する場合のみ）</label>
            <input class="form-input" type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="password-help">
            <small id="password-help" th:text="#{admin.passwordHelp}">空欄なら変更しません。8文字以上、UTF-8で72バイト以内。旧パスワードの入力は不要です。</small>
        </div>
        <button class="btn" type="submit" th:text="#{common.save}">保存する</button>
        <a class="link" th:href="@{/admin/users}" th:text="#{common.back}">戻る</a>
    </form>
</main></body></html>
