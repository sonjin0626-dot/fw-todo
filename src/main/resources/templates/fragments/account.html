<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav th:fragment="account" class="account-bar" aria-label="アカウント" sec:authorize="isAuthenticated()">
        <span><strong sec:authentication="name">ユーザー名</strong> でログイン中</span>
        <a class="link" th:href="@{/todos}">ToDo一覧</a>
        <a class="link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">ユーザー管理</a>
        <span sec:authorize="hasRole('ADMIN')">管理者</span>
        <form th:action="@{/logout}" method="post">
            <button class="btn sub" type="submit">ログアウト</button>
        </form>
    </nav>
</body>
</html>
