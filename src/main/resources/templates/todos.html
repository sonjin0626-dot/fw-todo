<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${trashMode ? #messages.msg('todo.trash') : #messages.msg('todo.list')}">一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <form id="quick-todo-form" class="quick-input-bar" th:unless="${trashMode}"
              th:action="@{/api/todo}" method="post" novalidate
              th:attr="data-error=#{quick.error},data-session-error=#{quick.sessionError},data-success=#{quick.success}">
            <label for="quick-todo-title" th:text="#{quick.label}">クイック入力</label>
            <div class="quick-input-controls">
                <input class="form-input" id="quick-todo-title" name="title" type="text"
                       maxlength="255" autocomplete="off" aria-describedby="quick-todo-error"
                       th:placeholder="#{quick.placeholder}">
                <button class="btn" type="submit" th:text="#{quick.add}">追加</button>
            </div>
            <p id="quick-todo-error" class="quick-input-error" role="alert" hidden></p>
            <span id="quick-todo-status" class="quick-input-status" role="status" aria-live="polite"></span>
        </form>
        <nav th:replace="~{fragments/language :: language}"></nav>
        <nav th:replace="~{fragments/account :: account}"></nav>
        <p class="flash flash-msg" role="status" th:if="${message != null}" th:text="${message}"></p>
        <p class="flash flash-msg" role="alert" th:if="${error != null}" th:text="${error}"></p>
        <h1 class="page-title" th:text="${trashMode ? #messages.msg('todo.trash') : #messages.msg('todo.list')}">一覧</h1>
        <p sec:authorize="hasRole('USER')" th:text="#{todo.mine(${totalCount})}"></p>
        <p sec:authorize="hasRole('ADMIN')" th:text="#{todo.allUsers(${totalCount})}"></p>
        <form class="search-bar" th:action="@{/todos}" method="get">
            <label for="keyword"><span th:text="#{todo.title}">やること</span>
                <input class="form-input" type="text" id="keyword" name="keyword" th:value="${keyword}">
            </label>
            <label for="category"><span th:text="#{todo.category}">ジャンル</span>
                <select class="form-input" id="category" name="category">
                    <option value="" th:selected="${category == ''}" th:text="#{common.all}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}" th:text="#{category.design}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}" th:text="#{category.marketing}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}" th:text="#{category.programming}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}" th:text="#{category.certification}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}" th:text="#{category.jobHunting}">就職活動</option>
                </select>
            </label>
            <input type="hidden" name="order" th:value="${order}">
            <input type="hidden" name="page" value="1">
            <input type="hidden" name="trash" th:value="${trashMode ? 1 : 0}">
            <input th:if="${trashMode}" type="hidden" name="includeCompleted" value="true">
            <label th:unless="${trashMode}" for="includeCompleted">
                <input type="checkbox" id="includeCompleted" name="includeCompleted" value="true" th:checked="${includeCompleted}" th:text="#{todo.includeCompleted}">
                完了したものも表示する
            </label>
            <button class="btn" type="submit" th:text="#{common.filter}">絞り込む</button>
            <a class="btn sub" th:unless="${trashMode}"
               th:href="@{/api/todos.csv(keyword=${keyword},category=${category},order=${order},includeCompleted=${includeCompleted})}"
               download="todos.csv" th:text="#{todo.export}">CSVを書き出す</a>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='asc',includeCompleted=${includeCompleted},page=1,trash=${trashMode ? 1 : 0})}" th:text="#{todo.dueAsc}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='desc',includeCompleted=${includeCompleted},page=1,trash=${trashMode ? 1 : 0})}" th:text="#{todo.dueDesc}">期限が遠い順</a>
            <a class="link" th:unless="${trashMode}" th:href="@{/todos(keyword=${keyword},category=${category},order='manual',includeCompleted=${includeCompleted},page=1)}" th:text="#{reorder.manual}">手動順</a>
            <a class="btn" th:href="@{/todos/new}" th:text="#{todo.new}">新規登録</a>
            <a class="link" th:href="@{/calendar}" th:text="#{calendar.view}">カレンダーで見る</a>
            <a class="link" th:unless="${trashMode}" th:href="@{/todos(trash=1)}" th:text="#{todo.viewTrash}">消したものを見る</a>
            <a class="link" th:if="${trashMode}" th:href="@{/todos}" th:text="#{todo.back}">一覧へ</a>
        </form>
        <p id="todo-empty" th:if="${#lists.isEmpty(todos)}" th:text="#{todo.empty}">条件に合うやることはありません</p>
        <form sec:authorize="hasRole('ADMIN')" th:if="${!trashMode}" id="bulk-delete-form" class="bulk-actions"
              th:action="@{/todos/bulk-delete}" method="post">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="category" th:value="${category}">
            <input type="hidden" name="order" th:value="${order}">
            <input type="hidden" name="includeCompleted" th:value="${includeCompleted}">
            <input type="hidden" name="page" th:value="${page}">
            <button class="btn" type="submit" id="bulk-delete-button" disabled th:text="#{bulk.delete}">選択した項目を削除</button>
            <span id="bulk-selection-count" role="status" th:text="#{bulk.count(0)}">0件選択</span>
            <small th:text="#{bulk.help}">全選択は、このページに表示中の項目が対象です。</small>
        </form>
        <form th:if="${!trashMode}" id="bulk-status-form"
              th:action="@{/todos/bulk-status}" method="post">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="category" th:value="${category}">
            <input type="hidden" name="order" th:value="${order}">
            <input type="hidden" name="includeCompleted" th:value="${includeCompleted}">
            <input type="hidden" name="page" th:value="${page}">
            <div id="bulk-status-bar" class="bulk-actions" hidden>
                <span id="bulk-status-count" role="status" aria-live="polite"></span>
                <label for="bulk-new-status" th:text="#{bulk.status.label}">変更後の状態</label>
                <select id="bulk-new-status" class="form-input" name="newStatus">
                    <option value="true" th:text="#{bulk.status.complete}">完了にする</option>
                    <option value="false" th:text="#{bulk.status.reopen}">未完了に戻す</option>
                </select>
                <button class="btn" type="submit" id="bulk-status-button" disabled th:text="#{bulk.status.apply}">一括変更</button>
                <small th:text="#{bulk.status.help}"></small>
            </div>
        </form>
        <p th:if="${!trashMode and order == 'manual'}" th:text="#{reorder.help}"></p>
        <p id="reorder-status" role="status" aria-live="polite"></p>
        <table class="todo-table" id="todo-table" th:hidden="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th th:if="${!trashMode and order == 'manual'}" th:text="#{reorder.manual}" scope="col"></th>
                    <th sec:authorize="hasRole('ADMIN')" th:unless="${trashMode}" scope="col">
                        <label><input type="checkbox" id="bulk-select-all" th:text="#{bulk.all}">全選択</label>
                    </th>
                    <th th:unless="${trashMode}" scope="col"><label><input type="checkbox" id="status-select-all"><span th:text="#{bulk.status.all}">状態変更の全選択</span></label></th>
                    <th th:unless="${trashMode}" scope="col" th:text="#{todo.pin}">印</th>
                    <th sec:authorize="hasRole('ADMIN')" scope="col" th:text="#{todo.owner}">所有者ID</th>
                    <th scope="col" th:text="#{todo.title}">やること</th>
                    <th scope="col" th:text="#{todo.category}">ジャンル</th>
                    <th scope="col" th:text="#{todo.priority}">優先度</th>
                    <th scope="col" th:text="#{todo.dueDate}">期限</th>
                    <th scope="col" th:text="#{common.status}">状態</th>
                    <th scope="col" th:text="#{common.actions}">操作</th>
                </tr>
            </thead>
            <tbody id="todo-list" th:attr="data-reorder-url=@{/api/todo/reorder},data-enabled=${!trashMode and order == 'manual'},data-saved=#{reorder.saved},data-error=#{reorder.error}">
                <th:block th:each="todo : ${todos}">
                    <tr th:replace="~{fragments/todo-row :: row(${todo})}"></tr>
                </th:block>
            </tbody>
        </table>
        <nav th:if="${totalCount > 0}" th:attr="aria-label=#{todo.pages}">
            <span th:each="pageNumber : ${#numbers.sequence(1, totalPages)}">
                <strong th:if="${pageNumber == page}" aria-current="page" th:text="${pageNumber}"></strong>
                <a class="link" th:unless="${pageNumber == page}"
                   th:href="@{/todos(keyword=${keyword},category=${category},order=${order},includeCompleted=${includeCompleted},page=${pageNumber},trash=${trashMode ? 1 : 0})}"
                   th:text="${pageNumber}"></a>
            </span>
        </nav>
    </div>
    <template id="quick-todo-row" th:unless="${trashMode}">
        <tr th:replace="~{fragments/todo-row :: row(${quickTodo})}"></tr>
    </template>
    <script th:src="@{/js/quick-input.js}" defer></script>
    <script th:unless="${trashMode}" th:inline="javascript">
        const selectionMessage = /*[[#{bulk.count('COUNT_VALUE')}]]*/ "COUNT_VALUE selected";
        const deleteMessage = /*[[#{bulk.confirm('COUNT_VALUE')}]]*/ "Delete COUNT_VALUE tasks?";
        const bulkForm = document.getElementById('bulk-delete-form');
        const selectAll = document.getElementById('bulk-select-all');
        if (bulkForm && selectAll) {
            const getCheckboxes = () => Array.from(document.querySelectorAll('input[name="ids"][form="bulk-delete-form"]'));
            const deleteButton = document.getElementById('bulk-delete-button');
            const selectionCount = document.getElementById('bulk-selection-count');
            function updateSelection() {
                const checkboxes = getCheckboxes();
                const count = checkboxes.filter(checkbox => checkbox.checked).length;
                deleteButton.disabled = count === 0;
                selectionCount.textContent = selectionMessage.replace('COUNT_VALUE', count);
                selectAll.checked = checkboxes.length > 0 && count === checkboxes.length;
                selectAll.indeterminate = count > 0 && count < checkboxes.length;
            }
            selectAll.addEventListener('change', () => {
                for (const checkbox of getCheckboxes()) {
                    checkbox.checked = selectAll.checked;
                }
                updateSelection();
            });
            document.addEventListener('change', event => {
                if (event.target.matches('input[form="bulk-delete-form"]')) updateSelection();
            });
            document.addEventListener('todo:created', updateSelection);
            bulkForm.addEventListener('submit', event => {
                const checkboxes = getCheckboxes();
                const count = checkboxes.filter(checkbox => checkbox.checked).length;
                if (count === 0 || !window.confirm(deleteMessage.replace('COUNT_VALUE', count))) {
                    event.preventDefault();
                }
            });
            updateSelection();
        }
    </script>
    <script th:inline="javascript">
        (() => {
            const form = document.getElementById('bulk-status-form');
            if (form) {
                const getBoxes = () => Array.from(document.querySelectorAll('input[form="bulk-status-form"][name="selectedIds"]:not(:disabled)'));
                const all = document.getElementById('status-select-all');
                const bar = document.getElementById('bulk-status-bar');
                const button = document.getElementById('bulk-status-button');
                const countLabel = document.getElementById('bulk-status-count');
                const message = /*[[#{bulk.count('COUNT_VALUE')}]]*/ 'COUNT_VALUE selected';
                const update = () => {
                    const boxes = getBoxes();
                    const count = boxes.filter(box => box.checked).length;
                    countLabel.textContent = message.replace('COUNT_VALUE', count);
                    bar.hidden = count === 0;
                    button.disabled = count === 0;
                    all.checked = boxes.length > 0 && count === boxes.length;
                    all.disabled = boxes.length === 0;
                    all.indeterminate = count > 0 && count < boxes.length;
                };
                all.addEventListener('change', () => {
                    getBoxes().forEach(box => box.checked = all.checked);
                    update();
                });
                document.addEventListener('change', event => {
                    if (event.target.matches('input[form="bulk-status-form"]')) update();
                });
                document.addEventListener('todo:created', update);
                form.addEventListener('submit', event => {
                    if (!getBoxes().some(box => box.checked)) event.preventDefault();
                    else button.disabled = true;
                });
                window.addEventListener('pageshow', update);
                update();
            }
            document.querySelectorAll('.flash-msg').forEach(message => {
                setTimeout(() => {
                    message.style.transition = 'opacity 0.5s';
                    message.style.opacity = '0';
                    setTimeout(() => message.remove(), 500);
                }, 4000);
            });
        })();
    </script>
    <script th:src="@{/js/drag-sort.js}" defer></script>
</body>
</html>
