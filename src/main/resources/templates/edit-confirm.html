<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編集の確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">編集の確認</h1>
        <form th:action="@{/todos/{id}(id=${id})}" th:object="${todo}" method="post">
            <p>やること</p>
            <p class="confirm-value" th:text="${#strings.isEmpty(todo.title) ? '（入力なし）' : todo.title}"></p>
            <p>メモ</p>
            <p class="confirm-value" th:text="${#strings.isEmpty(todo.detail) ? '（入力なし）' : todo.detail}"></p>
            <p>ジャンル</p>
            <p class="confirm-value" th:text="${#strings.isEmpty(todo.category) ? '（入力なし）' : todo.category}"></p>
            <p>優先度</p>
            <p class="confirm-value" th:text="${todo.priority == null ? '（入力なし）' : (todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低'))}"></p>
            <p>期限</p>
            <p class="confirm-value" th:text="${todo.dueDate == null ? '（入力なし）' : #temporals.format(todo.dueDate, 'yyyy-MM-dd')}"></p>
            <p>完了</p>
            <p class="confirm-value" th:text="${todo.completed == null ? '（入力なし）' : (todo.completed ? '完了' : '未完了')}"></p>
            <input type="hidden" th:field="*{title}">
            <input type="hidden" th:field="*{detail}">
            <input type="hidden" th:field="*{category}">
            <input type="hidden" th:field="*{priority}">
            <input type="hidden" th:field="*{dueDate}">
            <input type="hidden" th:field="*{completed}">
            <div class="confirm-actions">
                <button class="btn" type="submit">保存する</button>
                <button class="btn sub" type="submit" th:formaction="@{/todos/{id}/edit(id=${id})}">書き直す</button>
            </div>
        </form>
    </div>
</body>
</html>
